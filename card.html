<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J Plancarte Diesel Inspections</title>
<meta name="description" content="J Plancarte Diesel Inspections - Mobile CARB Clean Truck Check. We come to you. Inland Empire & LA.">
<meta property="og:title" content="J Plancarte Diesel Inspections">
<meta property="og:description" content="Mobile Clean Truck Check - We come to you. Tap to call or text.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0d1b2a">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b2a;--charcoal:#1b263b;--red:#b3221f;--red-bright:#e0312c;--cream:#f4f1ec;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:Barlow,sans-serif;background:radial-gradient(circle at 50% 0%,#1b263b 0%,#0d1b2a 60%,#070e16 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--cream);}
.card{width:100%;max-width:380px;background:linear-gradient(160deg,#142235 0%,#0d1b2a 100%);border-radius:24px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04) inset;border-top:4px solid var(--red);}
.head{text-align:center;padding:30px 24px 18px;position:relative;}
.head::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:60px;height:3px;background:var(--red-bright);border-radius:2px;}
.name{font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:.95;letter-spacing:1px;color:#fff;}
.name span{color:var(--red-bright);}
.tag{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#9fb0c3;margin-top:8px;font-weight:600;}
.certbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:16px 24px 4px;}
.chip{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;background:rgba(179,34,31,.15);border:1px solid rgba(224,49,44,.4);color:#f0a8a5;padding:5px 11px;border-radius:20px;}
.qrwrap{display:flex;justify-content:center;padding:22px 24px 8px;}
.qrbox{background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.qrbox img{display:block;width:200px;height:200px;border-radius:8px;}
.scanlabel{text-align:center;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--red-bright);padding:4px 0 18px;}
.btns{padding:4px 24px 26px;display:flex;flex-direction:column;gap:11px;}
.btn{display:flex;align-items:center;gap:14px;text-decoration:none;padding:15px 18px;border-radius:14px;font-size:16px;font-weight:600;letter-spacing:.3px;transition:transform .12s ease;}
.btn:active{transform:scale(.97);}
.btn svg{width:22px;height:22px;flex-shrink:0;}
.btn-call{background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(179,34,31,.4);}
.btn-text,.btn-web{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.12);}
.btn .sub{display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,.6);letter-spacing:1px;text-transform:uppercase;}
.btn-call .sub{color:rgba(255,255,255,.8);}
.foot{text-align:center;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#5e7088;padding:0 24px 22px;}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="name">J PLANCARTE<br><span>DIESEL INSPECTIONS</span></div>
    <div class="tag">Mobile Clean Truck Check</div>
  </div>
  <div class="certbar">
    <div class="chip">CARB Certified</div>
    <div class="chip">We Come To You</div>
    <div class="chip">Tester ID E256210</div>
  </div>
  <div class="qrwrap">
    <div class="qrbox"><img src="qr.png" alt="Scan to contact"></div>
  </div>
  <div class="scanlabel">SCAN ME</div>
  <div class="btns">
    <a class="btn btn-call" href="tel:+19095414375">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span>Call Now<span class="sub">(909) 541-4375</span></span>
    </a>
    <a class="btn btn-text" href="sms:+19095414375">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Text Me<span class="sub">Book an inspection</span></span>
    </a>
    <a class="btn btn-web" href="https://jpinspections.net" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span>Visit Website<span class="sub">jpinspections.net</span></span>
    </a>
  </div>
  <div class="foot">Serving the Inland Empire &amp; LA</div>
</div>
</body>
</html>
